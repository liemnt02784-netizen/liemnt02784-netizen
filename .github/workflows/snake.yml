name: Platinum snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#e5e4e2&color_dots=#161b22,#3a3f46,#6b7280,#a8adb5,#f4f5f7
            dist/snake-light.svg?color_snake=#5c636d&color_dots=#ebedf0,#d9dde2,#a8adb5,#6b7280,#3a3f46

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
